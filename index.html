<style>
:root{
  --turf:#0e1a13; --turf-2:#14251b; --line:#25402f; --chalk:#f1efe4; --muted:#93a89a;
  --amber:#ffb81c; --live:#e5383b;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--turf);color:var(--chalk);font-family:var(--body)}
body{min-height:100vh}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--turf-2)}
.brand{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.04em}
.brand span{color:var(--amber)}
.now{margin-inline-start:auto;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.now b{color:var(--chalk);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--live);box-shadow:0 0 0 4px #e5383b33}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;padding:20px;max-width:1500px;margin:0 auto}
.stage{min-width:0}
#playerFrame{position:relative;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
#playerMount{position:absolute;inset:0}
#playerMount iframe,.alwan-video{width:100%;height:100%;border:0;background:#000;display:block;object-fit:contain}
#loadingState{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#000a;z-index:3;pointer-events:none}
.spinner{width:46px;height:46px;border-radius:50%;border:4px solid #ffffff2e;border-top-color:var(--amber);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.premium-error{position:absolute;inset:0;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--muted)}
.premium-error strong{color:var(--chalk);font-size:20px}
.alwan-controls{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:26px 12px 10px;background:linear-gradient(transparent,#000c);opacity:0;transition:opacity .2s;pointer-events:none}
.alwan-controls.visible{opacity:1;pointer-events:auto}
.alwan-controls-row{display:flex;align-items:center;gap:10px}
.alwan-spacer{flex:1}
.alwan-ctrl{width:38px;height:38px;border:0;border-radius:8px;background:#ffffff1f;color:#fff;font-size:16px;cursor:pointer}
.alwan-ctrl:hover{background:#ffffff38}
.alwan-volume{width:96px;accent-color:var(--amber)}
.alwan-live{height:34px;padding:0 14px;border:0;border-radius:8px;background:var(--live);color:#fff;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;cursor:pointer}
.alwan-live.behind{background:#ffffff26}
.stage-info{display:flex;align-items:baseline;gap:14px;margin:16px 2px 12px}
#channelTitle{margin:0;font-family:var(--display);font-size:32px;font-weight:700;letter-spacing:.03em}
#streamType{font-size:13px;color:var(--muted)}
.servers-label{font-size:13px;color:var(--muted);margin:0 2px 8px}
#serverButtons{display:flex;flex-wrap:wrap;gap:8px}
.server-button{padding:9px 16px;border:1px solid var(--line);border-radius:8px;background:var(--turf-2);color:var(--chalk);font-family:var(--body);font-weight:600;font-size:13px;cursor:pointer}
.server-button:hover{border-color:var(--muted)}
.server-button.active{background:var(--amber);border-color:var(--amber);color:#1a1400}
aside{min-width:0}
aside h2{margin:0 0 10px;font-family:var(--display);font-size:20px;letter-spacing:.05em;color:var(--muted);font-weight:600}
#channelList{display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 120px);overflow-y:auto;padding-inline-end:4px}
.channel-item{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:1px solid transparent;border-radius:8px;background:var(--turf-2);color:var(--chalk);text-align:start;cursor:pointer;font-family:var(--body)}
.channel-item:hover{border-color:var(--line)}
.channel-item.active{border-color:var(--amber);background:#1f3326}
.channel-item>span:nth-child(2){flex:1;min-width:0}
.channel-arrow{color:var(--amber);font-size:22px;line-height:1}
.channel-name{display:block;font-size:15px;font-weight:600}
.channel-sub{display:block;margin-top:2px;font-size:11px;color:var(--muted)}
.channel-logo{width:52px;height:34px;object-fit:contain;border-radius:4px;background:#0000004d;padding:2px}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.ad-slot{margin:0}
.ad-slot[hidden]{display:none}
.ad-top{max-width:1500px;margin:14px auto 0;padding:0 20px}
.ad-below{margin-top:16px}
.ad-side{margin-bottom:14px}
.ad-box{border:1px solid var(--line);border-radius:8px;padding:6px 8px 8px;background:var(--turf-2);overflow:hidden;text-align:center}
.ad-tag{display:block;text-align:start;font-size:10px;color:var(--muted);margin-bottom:4px}
.ad-box img{display:block;max-width:100%;height:auto;margin:0 auto;border-radius:4px}
.ad-box iframe,.ad-box ins{max-width:100%}
@media (max-width:980px){
  .ad-top{padding:0 12px}
  .layout{grid-template-columns:1fr;padding:12px}
  #channelList{max-height:none}
  #channelTitle{font-size:26px}
}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:2s}.alwan-controls{transition:none}}
</style>

function renderAds(){
  const cfg=window.ADS_CONFIG;
  if(!cfg||!cfg.enabled) return;
  document.querySelectorAll('[data-ad-slot]').forEach(el=>{
    const c=cfg.slots&&cfg.slots[el.dataset.adSlot];
    if(!c||!c.type||c.type==='none') return;
    const box=document.createElement('div');box.className='ad-box';
    const tag=document.createElement('span');tag.className='ad-tag';tag.textContent=cfg.label||'Ad';box.appendChild(tag);
    try{
      if(c.type==='image'){
        const list=Array.isArray(c.items)&&c.items.length?c.items:[c];
        const it=list[Math.floor(Math.random()*list.length)];
        if(!it.src) return;
        const a=document.createElement('a');a.href=it.href||'#';a.target='_blank';a.rel='sponsored noopener noreferrer';
        const img=document.createElement('img');img.src=it.src;img.alt=it.alt||'Ad';img.loading='lazy';
        img.onerror=()=>{el.hidden=true};
        a.appendChild(img);box.appendChild(a);
      }else if(c.type==='adsense'){
        const client=c.client||cfg.adsenseClient;
        if(!client||!c.slot) return;
        if(!document.getElementById('adsense-js')){
          const sc=document.createElement('script');sc.id='adsense-js';sc.async=true;sc.crossOrigin='anonymous';
          sc.src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client='+encodeURIComponent(client);
          document.head.appendChild(sc);
        }
        const ins=document.createElement('ins');ins.className='adsbygoogle';ins.style.display='block';
        ins.setAttribute('data-ad-client',client);ins.setAttribute('data-ad-slot',c.slot);
        ins.setAttribute('data-ad-format',c.format||'auto');ins.setAttribute('data-full-width-responsive','true');
        box.appendChild(ins);
        el.appendChild(box);el.hidden=false;
        (window.adsbygoogle=window.adsbygoogle||[]).push({});
        return;
      }else if(c.type==='html'){
        if(!c.code) return;
        box.appendChild(document.createRange().createContextualFragment(c.code));
      }else return;
      el.appendChild(box);el.hidden=false;
    }catch(e){console.warn('Ad slot failed:',el.dataset.adSlot,e)}
  });
}

    hideTimer=setTimeout(()=>{
      if(!video.paused && !wrap.matches(':hover')) controls.classList.remove('visible');
    },2800);
  };
  const windowInfo=()=>{
    try{
      if(video.seekable && video.seekable.length) return {start:video.seekable.start(0),end:video.seekable.end(video.seekable.length-1)};
    }catch(e){}
    return {start:0,end:Number.isFinite(video.duration)?video.duration:0};
  };
  const update=()=>{
    const w=windowInfo();
    const span=Math.max(.001,w.end-w.start);
    const pos=Math.max(0,Math.min(1,(video.currentTime-w.start)/span));
    const behind=pos<.985;
    live.classList.toggle('behind',behind);
    live.textContent=behind?'GO LIVE':'LIVE';
    play.textContent=video.paused?'▶':'❚❚';
    play.setAttribute('aria-label',video.paused?'Play':'Pause');
    mute.textContent=(video.muted || video.volume===0)?'🔇':'🔊';
    mute.setAttribute('aria-label',(video.muted || video.volume===0)?'دەنگ چالاک بکە':'دەنگ بێدەنگ بکە');
    volume.value=video.volume;
  };
  mute.onclick=()=>{
    if(video.muted || video.volume===0){
      video.muted=false;
      if(video.volume===0) video.volume=Number(volume.value)||1;
    }else{
      video.muted=true;
    }
    update();show();
  };
  volume.addEventListener('input',()=>{
    video.volume=Number(volume.value);
    video.muted=video.volume===0;
    update();show();
  });
  play.onclick=()=>{if(video.paused) video.play().catch(()=>{});else video.pause();show()};
  const enterFullscreen=()=>{
    try{
      if(document.fullscreenElement){document.exitFullscreen?.();return}
      if(wrap.requestFullscreen){wrap.requestFullscreen({navigationUI:'hide'}).catch(()=>{});return}
      if(video.webkitEnterFullscreen){video.webkitEnterFullscreen();return}
      if(video.webkitRequestFullscreen){video.webkitRequestFullscreen();return}
    }catch(e){}
    show();
  };
  fs.onclick=enterFullscreen;
  live.onclick=()=>{
    const w=windowInfo();
    if(w.end>w.start) video.currentTime=Math.max(w.start,w.end-.15);
    video.play().catch(()=>{});
    show();
  };
  ['mousemove','pointermove','touchstart','touchend'].forEach(ev=>wrap.addEventListener(ev,show,{passive:true}));
  wrap.addEventListener('dblclick',enterFullscreen);
  wrap.addEventListener('mouseleave',()=>{if(!video.paused) controls.classList.remove('visible')});
  window.addEventListener('fullscreenchange',update);
  ['play','pause','timeupdate','progress','durationchange','loadedmetadata','canplay','playing'].forEach(ev=>video.addEventListener(ev,update));
  video.addEventListener('waiting',()=>{setLoading(true);show()});
  video.addEventListener('playing',()=>{setLoading(false);show()});
  const onKey=(e)=>{
    if(document.activeElement && ['INPUT','BUTTON'].includes(document.activeElement.tagName)) return;
    if(e.code==='Space'){e.preventDefault();play.click()}
    else if(e.key.toLowerCase()==='f') enterFullscreen();
  };
  window.addEventListener('keydown',onKey);
  update();show();
  return ()=>{
    clearTimeout(hideTimer);
    window.removeEventListener('keydown',onKey);
    window.removeEventListener('fullscreenchange',update);
    controls.remove();
    try{video.pause()}catch(e){}
  };
}

// Route every HLS request through this site's Cloudflare Worker.
// The Worker rewrites nested playlist/segment URLs back through /proxy as well.
function sameDomainProxyUrl(sourceUrl){
  if(typeof sourceUrl==='string' && sourceUrl.startsWith('/proxy')) return sourceUrl;
  try{
    const parsed = new URL(sourceUrl, location.href);
    // Some older entries contain a masked/placeholder Worker hostname.
    // Recover the actual upstream URL from its query string when possible.
    if (/^x+$/i.test(parsed.hostname.split('.')[0])) {
      const nested = parsed.searchParams.get('url') || parsed.searchParams.get('target');
      if (nested) return location.origin + '/proxy?url=' + encodeURIComponent(nested);
    }
    if (parsed.origin === location.origin && parsed.pathname.startsWith('/proxy')) return parsed.href;
    return location.origin + '/proxy?url=' + encodeURIComponent(parsed.href);
  }catch(e){
    return sourceUrl;
  }
}


// Try the direct URL first (works when the source allows CORS), then this site's /proxy.
function sourceCandidates(url){
  const abs=/^https?:\/\//i.test(url);
  const prox=sameDomainProxyUrl(url);
  if(!abs) return [prox];
  return prox===url?[url]:[url,prox];
}
function tryNextServer(reason){
  const urls=channelServers[activeId]||[];
  for(let n=activeServer+1;n<=urls.length;n++){
    if(urls[n-1]){ streamType.textContent='SERVER '+activeServer+' failed ('+reason+') → SERVER '+n; openServer(activeId,n); return true; }
  }
  return false;
}

function createPremiumPlayer(url,name){
  if(location.protocol==='file:' && url.startsWith('/proxy')){
    mount.innerHTML='<div class="premium-error"><strong>This source needs your website</strong><span>/proxy only exists on your hosted domain (Cloudflare Worker). Opening the file from your computer cannot load it. Try another SERVER.</span></div>';
    setLoading(false);streamType.textContent='NEEDS HOSTED /proxy';
    setTimeout(()=>tryNextServer('local file'),1200);
    return;
  }
  setLoading(true);
  mount.innerHTML='';
  mount.classList.add('premium-mount');
  const video=document.createElement('video');
  video.className='alwan-video';
  video.setAttribute('playsinline','');
  video.setAttribute('webkit-playsinline','');
  video.setAttribute('preload','auto');
  video.setAttribute('controlslist','nodownload noplaybackrate');
  video.setAttribute('aria-label',name);
  video.autoplay=true;
  video.muted=true;
  video.playsInline=true;
  mount.appendChild(video);
  activeVideo=video;

  let hls=null;
  const playWhenReady=()=>video.play().catch(()=>{});
  const handleNativeError=()=>{
    setLoading(false);
    streamType.textContent='STREAM ERROR • CHECK SOURCE/CORS';
  };

  if(window.Hls && Hls.isSupported()){
    hls=new Hls({
      enableWorker:true,
      lowLatencyMode:true,
      backBufferLength:30,
      liveSyncDurationCount:3,
      liveMaxLatencyDurationCount:8,
      manifestLoadingTimeOut:20000,
      fragLoadingTimeOut:20000,
      capLevelToPlayerSize:true
    });
    hlsInstance=hls;
    hls.attachMedia(video);
    const cands=sourceCandidates(url);let ci=0;
    hls.on(Hls.Events.MEDIA_ATTACHED,()=>hls.loadSource(cands[0]));
    hls.on(Hls.Events.MANIFEST_PARSED,()=>{
      setLoading(false);
      streamType.textContent='PREMIUM • HLS • LIVE';
      playWhenReady();
    });
    hls.on(Hls.Events.ERROR,(_event,data)=>{
      if(!data || !data.fatal) return;
      const code=(data.response&&data.response.code)?'HTTP '+data.response.code:(data.details||'error');
      if(data.type===Hls.ErrorTypes.NETWORK_ERROR){
        if(ci<cands.length-1){ci++;streamType.textContent='RETRY VIA PROXY…';try{hls.loadSource(cands[ci])}catch(e){}return}
        setLoading(false);
        if(!tryNextServer(code)) streamType.textContent='OFFLINE • '+code;
      }else if(data.type===Hls.ErrorTypes.MEDIA_ERROR){
        try{hls.recoverMediaError()}catch(e){handleNativeError()}
      }else{
        setLoading(false);
        if(!tryNextServer(code)) streamType.textContent='STREAM ERROR • '+code;
        try{hls.destroy()}catch(e){}
      }
    });
    cleanupPlayer=attachControls(video,hls);
  }else if(video.canPlayType('application/vnd.apple.mpegurl')){
    video.src=sourceCandidates(url)[0];
    video.addEventListener('loadedmetadata',()=>{
      setLoading(false);
      streamType.textContent='PREMIUM • HLS • LIVE';
      playWhenReady();
    },{once:true});
    video.addEventListener('error',handleNativeError);
    cleanupPlayer=attachControls(video,null);
    video.load();
  }else{
    mount.innerHTML='<div class="premium-error"><strong>Player unavailable</strong><span>This browser cannot play HLS streams.</span></div>';
    setLoading(false);
    streamType.textContent='UNSUPPORTED PLAYER';
    return;
  }
  video.addEventListener('playing',()=>{setLoading(false);streamType.textContent='PREMIUM • HLS • LIVE'});
  video.addEventListener('waiting',()=>setLoading(true));
  video.addEventListener('error',handleNativeError);
}

function createIframe(url){
  const iframe=document.createElement('iframe');iframe.src=url;iframe.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';iframe.allowFullscreen=true;iframe.referrerPolicy='strict-origin-when-cross-origin';mount.appendChild(iframe);setLoading(false);streamType.textContent='LIVE';
}
const serverButtons=document.getElementById('serverButtons');
function renderServerButtons(channelId){
  if(!serverButtons) return;
  serverButtons.innerHTML='';
  const serverCount = Number(channelId) === 16 ? 1 : 5;
  for(let n=1;n<=serverCount;n++){
    const b=document.createElement('button');
    b.type='button'; b.className='server-button'+(n===1?' active':'');
    b.textContent='SERVER '+n; b.setAttribute('aria-label','Play SERVER '+n);
    b.addEventListener('click',()=>openServer(channelId,n));
    serverButtons.appendChild(b);
  }
}
function openServer(channelId,serverNo){
  const ch=channels.find(x=>x.id===Number(channelId))||channels[0];
  const urls=channelServers[ch.id];
  const url=urls ? urls[serverNo-1] : ch.url;
  if(!url) return;
  activeId=ch.id;activeServer=serverNo;
  document.querySelectorAll('.server-button').forEach((b,i)=>b.classList.toggle('active',i===serverNo-1));
  destroy();
  currentTitle.textContent=ch.name; channelTitle.textContent=ch.name;
  if(url.includes('ok.ru/videoembed/')) createIframe(url.startsWith('//')?'https:'+url:url);
  else if(url.endsWith('.m3u8') || url.includes('.m3u8?')) createPremiumPlayer(url,ch.name);
  else createIframe(url);
  const u=new URL(location.href);u.searchParams.set('channel',String(ch.id));u.searchParams.set('server',String(serverNo));history.replaceState({channel:ch.id,server:serverNo},'',u.pathname+u.search);
}

function openChannelUnlocked(id){
  const ch=channels.find(x=>x.id===Number(id))||channels[0];
  activeId=ch.id;destroy();
  document.querySelectorAll('.channel-item').forEach(x=>x.classList.toggle('active',Number(x.dataset.id)===ch.id));
  currentTitle.textContent=ch.name;channelTitle.textContent=ch.name;
  renderServerButtons(ch.id);
  if(ch.type==='offline' && !channelServers[ch.id]){
    mount.classList.remove('premium-mount');
    mount.innerHTML='<div class="premium-error"><strong>'+ch.name+'</strong><span>ئەم کەناڵە سەرچاوەی پەخشی نییە.</span></div>';
    setLoading(false);streamType.textContent='SOURCE NOT CONFIGURED';
  }else openServer(ch.id,1);
}
